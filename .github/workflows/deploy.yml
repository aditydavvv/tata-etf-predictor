name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Refresh the baked-in market snapshot through NSE hours (08:30-15:30 IST).
  # Yahoo Finance and Groww send no CORS headers, so a static bundle cannot
  # refresh prices on its own — this is what keeps them from going stale.
  schedule:
    - cron: '5,25,45 4-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Yahoo/Groww are blocked by CORS in the browser, so prices are pulled
      # here and baked into public/prices.json before the bundle is built.
      - name: Fetch market snapshot
        run: npm run fetch:prices
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
